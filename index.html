<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قارئ الوصفات</title>
<style>
  body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#0f172a;color:#fff;text-align:center;padding:16px}
  h1{font-size:22px;margin:8px 0 16px}
  #box{max-width:460px;margin:auto}
  video{width:100%;border-radius:12px;background:#000;display:none}
  button{background:#16a34a;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;margin:6px;cursor:pointer}
  button.sec{background:#2563eb}
  button.red{background:#dc2626}
  #result{font-size:26px;letter-spacing:1px;margin:16px 0;word-break:break-all;background:#1e293b;border-radius:12px;padding:14px;min-height:30px}
  #msg{color:#fbbf24;font-size:14px;min-height:20px;margin:8px 0}
  input[type=file]{display:none}
</style>
</head>
<body>
<div id="box">
  <h1>قارئ QR والباركود للوصفات</h1>
  <video id="video" playsinline muted></video>
  <div id="msg"></div>
  <button onclick="startCam()">تشغيل الكاميرا</button>
  <button class="red" onclick="stopCam()">إيقاف الكاميرا</button>
  <button class="sec" onclick="document.getElementById('file').click()">قراءة من صورة</button>
  <input type="file" id="file" accept="image/*" onchange="readFile(event)">
  <div id="result">---</div>
  <button onclick="copyNum()">نسخ الرقم</button>
  <button class="sec" onclick="openWasfaty()">فتح وصفتي</button>
</div>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const video=document.getElementById('video');
const result=document.getElementById('result');
const msg=document.getElementById('msg');
let reader=null;

function makeReader(){
  const Z=ZXing;
  const hints=new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[
    Z.BarcodeFormat.QR_CODE,
    Z.BarcodeFormat.CODE_128,
    Z.BarcodeFormat.CODE_39,
    Z.BarcodeFormat.EAN_13,
    Z.BarcodeFormat.EAN_8,
    Z.BarcodeFormat.UPC_A,
    Z.BarcodeFormat.UPC_E,
    Z.BarcodeFormat.ITF,
    Z.BarcodeFormat.CODABAR,
    Z.BarcodeFormat.DATA_MATRIX
  ]);
  hints.set(Z.DecodeHintType.TRY_HARDER,true);
  return new Z.BrowserMultiFormatReader(hints,300);
}

function showCode(text){
  result.textContent=text;
  msg.textContent='تمت القراءة';
  copyNum();
}

async function startCam(){
  try{
    stopCam();
    reader=makeReader();
    video.style.display='block';
    msg.textContent='وجّه الكاميرا نحو الكود';
    await reader.decodeFromConstraints(
      {video:{facingMode:'environment'}},
      video,
      (res,err)=>{
        if(res){
          showCode(res.getText());
          stopCam();
        }
      }
    );
  }catch(e){
    msg.textContent='تعذر تشغيل الكاميرا، جرّب القراءة من صورة';
  }
}

function stopCam(){
  if(reader){reader.reset();reader=null;}
  video.style.display='none';
}

async function readFile(ev){
  const f=ev.target.files[0];
  if(!f)return;
  const url=URL.createObjectURL(f);
  try{
    const r=makeReader();
    const res=await r.decodeFromImageUrl(url);
    showCode(res.getText());
    r.reset();
  }catch(e){
    msg.textContent='لم يتم العثور على كود في الصورة';
  }
  ev.target.value='';
}

function copyNum(){
  const t=result.textContent;
  if(t&&t!=='---'){
    navigator.clipboard.writeText(t).then(()=>{msg.textContent='تم نسخ الرقم'}).catch(()=>{});
  }
}

function openWasfaty(){
  window.open('https://pp.wasfaty.sa/pharmacy/transactions','_blank');
}
</script>
</body>
</html>
